[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-hate-inference"
version = "0.1.0"
description = "Inferência de discurso de ódio em duas etapas com Gemma e PostgreSQL"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
gemma-hate = "gemma_hate_inference.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
